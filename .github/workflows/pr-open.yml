name: PR Open - Create Neon Branch

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  create-neon-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Neon Branch
        id: create-branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          parent: main
          branch_name: pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Comment PR with Database URL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `## 🚀 Neon Preview Branch Created

            Your preview database is ready!

            **Branch Name:** \`pr-${{ github.event.pull_request.number }}\`
            **Connection String:** \`${{ steps.create-branch.outputs.db_url }}\`

            > ⚠️ This database branch will be automatically deleted when the PR is closed.

            ### Using the Preview Database

            To test your changes with this preview database:
            1. Use the connection string above as your \`DATABASE_URL\`
            2. Run migrations if needed
            3. Test your changes

            ---
            *Powered by [Neon](https://neon.tech) - Serverless Postgres*
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Output Branch Info
        run: |
          echo "Neon branch created successfully"
          echo "Branch ID: ${{ steps.create-branch.outputs.branch_id }}"
          echo "Host: ${{ steps.create-branch.outputs.host }}"
