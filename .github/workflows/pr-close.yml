name: PR Close - Cleanup Resources

on:
  pull_request:
    types: [closed]

jobs:
  cleanup-neon-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Comment PR with Cleanup Confirmation
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `## 🧹 Resources Cleaned Up

            The following resources have been deleted:
            - ✅ Neon database branch: \`pr-${{ github.event.pull_request.number }}\`

            All preview resources associated with this PR have been removed.
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  cleanup-fly-app:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.ref != 'main' && github.event.pull_request.head.ref != 'master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Destroy Fly.io App
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Construct app name from PR number
          APP_NAME="skatespot-pr-${{ github.event.pull_request.number }}"
          
          # Check if app exists
          if flyctl status -a $APP_NAME 2>/dev/null; then
            echo "Destroying Fly.io app: $APP_NAME"
            flyctl apps destroy $APP_NAME -y
            echo "App destroyed successfully"
          else
            echo "App $APP_NAME does not exist, skipping..."
          fi

      - name: Comment PR with Fly Cleanup
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `## 🚀 Fly.io App Cleaned Up

            - ✅ Fly.io app: \`skatespot-pr-${{ github.event.pull_request.number }}\` has been destroyed.
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
